name: Build unsigned IPA

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iOS
        run: |
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa (unsigned — sign locally with Sideloadly before install)
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Jarvis.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Jarvis.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-unsigned-ipa
          path: Jarvis.ipa
          retention-days: 14
