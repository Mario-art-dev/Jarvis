name: Jarvis
options:
  bundleIdPrefix: com.mariomontesinos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""   # rellena tu Team ID de Apple Developer aquí

targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Sources/JarvisApp
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Jarvis necesita el micrófono para escuchar tus órdenes de voz."
        NSSpeechRecognitionUsageDescription: "Jarvis transcribe tu voz para entender tus peticiones."
        NSPhotoLibraryUsageDescription: "Jarvis puede buscar y mostrar fotos de tu galería cuando se lo pidas."
        NSPhotoLibraryAddUsageDescription: "Jarvis puede guardar imágenes en tu galería cuando se lo pidas."
        NSCalendarsUsageDescription: "Jarvis puede leer y crear eventos en tu calendario."
        NSRemindersUsageDescription: "Jarvis puede leer y crear recordatorios."
        NSContactsUsageDescription: "Jarvis puede buscar contactos para ayudarte a llamar o escribir."
        NSCameraUsageDescription: "Jarvis puede abrir la cámara cuando se lo pidas."
        NSAppleMusicUsageDescription: "Jarvis puede buscar y reproducir tus playlists de Música cuando se lo pidas."
        NSLocalNetworkUsageDescription: "Jarvis se conecta a tu servidor Claude Code en la red local para pensar y responder."
        # Makes Jarvis's own sandboxed Documents folder show up as a
        # location inside the Files app ("En mi iPhone > Jarvis"), so files
        # Jarvis creates are visible/manageable there without any extra
        # permission prompt — this is the only file storage third-party
        # apps get real access to on iOS.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Tailscale IPs (100.x.x.x) aren't in the private ranges
          # NSAllowsLocalNetworking covers, so ATS would otherwise block a
          # plain ws:// connection to them. Safe to allow here because
          # Tailscale's WireGuard tunnel already encrypts everything
          # end-to-end — the plaintext ws:// only ever exists inside that
          # tunnel, never on the open internet.
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes:
          # Every scheme AppLauncherTool might open has to be listed here —
          # canOpenURL returns false for anything undeclared, which the tool
          # reports as "app not installed" even when it is.
          - App-prefs
          - camera
          - photos-redirect
          - https
          - googleapp
          - google
          - shortcuts
          - marca
          - maps
          - tel
          - facetime
          - facetime-audio
          - mailto
          - sms
          - calshow
          - x-apple-reminder
          - whatsapp
          - spotify
          - instagram
          - tiktok
          - youtube
          - googlegmail
          - googlechrome
          - msteams
          - itms-apps
          - music
          - mobilenotes
          - voicememos
          - shareddocuments
          - comgooglemaps
          - chatgpt
          - claude
          - nflx
          - primevideo
          - movistarplus
          - hbomax
          - max
          - brawlstars
          - clashroyale
          - capcut
          - canva
          - clock-alarm
          - weather
          - liftoff
          - rider
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.mariomontesinos.jarvis
            CFBundleURLSchemes:
              - jarvisapp
    entitlements:
      path: Resources/Jarvis.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariomontesinos.jarvis
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
